
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book a Train Ticket</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<main class="container py-5">
    <div class="booking-card mx-auto">

        <header class="booking-header">
            <h1>Book a train ticket</h1>
        </header>

        <form class="booking-form" action="#" method="get">

            <fieldset class="mb-4">
                <legend class="visually-hidden">Trip type</legend>

                <div class="btn-group trip-toggle" role="group">
                    <input type="radio" class="btn-check"
                           name="trip" id="oneWay"
                           value="one-way" checked>
                    <label class="btn btn-outline-success" for="oneWay">
                        One way
                    </label>

                    <input type="radio" class="btn-check"
                           name="trip" id="roundTrip"
                           value="round-trip">
                    <label class="btn btn-outline-success" for="roundTrip">
                        Round trip
                    </label>
                </div>
            </fieldset>

            <div class="row g-3 mb-3">
                <div class="col-md-6">
                    <label for="from" class="form-label">From</label>
                    <input type="text" id="from" name="from"
                           class="form-control"
                           placeholder="Astana" required>
                </div>

                <div class="col-md-6">
                    <label for="to" class="form-label">To</label>
                    <input type="text" id="to" name="to"
                           class="form-control"
                           placeholder="Almaty" required>
                </div>
            </div>

            <div class="row g-3 mb-3">
                <div class="col-md-4">
                    <label for="departure" class="form-label">
                        Departure
                    </label>
                    <input type="date" id="departure"
                           name="departure"
                           class="form-control" required>
                </div>

                <div class="col-md-4">
                    <label for="return" class="form-label">
                        Return
                    </label>
                    <input type="date" id="return"
                           name="return"
                           class="form-control">
                </div>

                <div class="col-md-4">
                    <label for="passengers" class="form-label">
                        Passengers
                    </label>
                    <select id="passengers" name="passengers"
                            class="form-select">
                        <option value="1">1 adult</option>
                        <option value="2">2 adults</option>
                        <option value="3">3 adults</option>
                        <option value="4">4 adults</option>
                        <option value="5">5 adults</option>
                        <option value="6">6 adults</option>
                    </select>
                </div>
            </div>

            <fieldset class="mb-4">
                <legend class="form-label">Carriage class</legend>

                <div class="d-flex flex-wrap gap-3">
                    <div class="form-check">
                        <input class="form-check-input" type="radio"
                               name="carriage" id="seat"
                               value="seat" required>
                        <label class="form-check-label" for="seat">
                            Seat
                        </label>
                    </div>

                    <div class="form-check">
                        <input class="form-check-input" type="radio"
                               name="carriage" id="coupe"
                               value="coupe">
                        <label class="form-check-label" for="coupe">
                            Coupé
                        </label>
                    </div>

                    <div class="form-check">
                        <input class="form-check-input" type="radio"
                               name="carriage" id="sleeper"
                               value="sleeper">
                        <label class="form-check-label" for="sleeper">
                            Sleeper
                        </label>
                    </div>
                </div>
            </fieldset>

            <div class="row g-3 mb-4">
                <div class="col-md-6">
                    <label for="phone" class="form-label">
                        Phone
                    </label>
                    <div class="input-group">
                        <span class="input-group-text">+7</span>
                        <input type="tel" id="phone" name="phone"
                               class="form-control"
                               placeholder="701 234 56 78"
                               required>
                    </div>
                </div>

                <div class="col-md-6">
                    <label for="email" class="form-label">
                        Email
                    </label>
                    <input type="email" id="email" name="email"
                           class="form-control"
                           placeholder="name@example.com"
                           required>
                </div>
            </div>

            <div class="form-check form-switch mb-2">
                <input class="form-check-input" type="checkbox"
                       id="sms" name="sms">
                <label class="form-check-label" for="sms">
                    Also send the ticket by SMS
                </label>
            </div>

            <div class="form-check mb-4">
                <input class="form-check-input" type="checkbox"
                       id="agree" name="agree" required>
                <label class="form-check-label" for="agree">
                    I agree with the carriage rules
                </label>
            </div>

            <div class="d-flex flex-column flex-md-row
                        justify-content-md-end gap-3 booking-actions">
                <button type="reset" class="btn btn-clear">
                    Clear
                </button>
                <button type="submit" class="btn btn-find">
                    Find trains
                </button>
            </div>

        </form>
    </div>
</main>

</body>
</html>
