
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cafe Table Reservation</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<main class="container py-5">

    <section class="booking-card mx-auto">
        <header class="booking-header">
            <h1>Reserve a Table</h1>
        </header>

        <form class="booking-form" action="#" method="get">

            <div class="mb-3">
                <label for="customerName" class="form-label">
                    Your name
                </label>
                <input type="text" class="form-control"
                       id="customerName" name="customerName"
                       placeholder="Enter your name"
                       autocomplete="name" required>
            </div>

            <div class="mb-3">
                <label for="customerEmail" class="form-label">
                    Email
                </label>
                <input type="email" class="form-control"
                       id="customerEmail" name="customerEmail"
                       placeholder="name@example.com"
                       autocomplete="email" required>
            </div>

            <div class="mb-3">
                <label for="phone" class="form-label">
                    Phone
                </label>
                <input type="tel" class="form-control"
                       id="phone" name="phone"
                       placeholder="+7 701 234 56 78"
                       autocomplete="tel" required>
            </div>

            <div class="row g-3 mb-3">
                <div class="col-md-6">
                    <label for="guests" class="form-label">
                        Guests
                    </label>
                    <input type="number" class="form-control"
                           id="guests" name="guests"
                           min="1" max="20" step="1" required>
                </div>

                <div class="col-md-6">
                    <label for="date" class="form-label">
                        Reservation date
                    </label>
                    <input type="date" class="form-control"
                           id="date" name="date" required>
                </div>
            </div>

            <fieldset class="mb-3">
                <legend class="form-label">Seating</legend>

                <div class="form-check">
                    <input type="radio" class="form-check-input"
                           id="inside" name="seating"
                           value="inside" required>
                    <label class="form-check-label" for="inside">
                        Inside
                    </label>
                </div>

                <div class="form-check">
                    <input type="radio" class="form-check-input"
                           id="terrace" name="seating"
                           value="terrace">
                    <label class="form-check-label" for="terrace">
                        Terrace
                    </label>
                </div>
            </fieldset>

            <div class="mb-3">
                <label for="meal" class="form-label">
                    Meal
                </label>
                <select class="form-select" id="meal"
                        name="meal" required>
                    <option value="" selected disabled>
                        Choose a meal
                    </option>
                    <option value="lunch">Lunch</option>
                    <option value="dinner">Dinner</option>
                </select>
            </div>

            <div class="mb-3">
                <label for="comments" class="form-label">
                    Comments
                </label>
                <textarea class="form-control" id="comments"
                          name="comments" rows="4"
                          placeholder="Additional requests"></textarea>
            </div>

            <div class="form-check mb-4">
                <input type="checkbox" class="form-check-input"
                       id="terms" name="terms" value="yes" required>
                <label class="form-check-label" for="terms">
                    I agree to the terms
                </label>
            </div>

            <div class="d-grid">
                <button type="submit" class="btn btn-find">
                    Reserve
                </button>
            </div>

        </form>
    </section>

</main>

</body>
</html>
